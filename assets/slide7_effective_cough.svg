<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="accentBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="warnBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Prompt', 'Kanit', sans-serif; font-size: 34px; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: 'Prompt', 'Kanit', sans-serif; font-size: 19px; font-weight: 600; fill: #e0f2fe; }
    .card-title { font-family: 'Prompt', 'Kanit', sans-serif; font-size: 22px; font-weight: 800; fill: #0f172a; }
    .card-desc { font-family: 'Prompt', 'Kanit', sans-serif; font-size: 17.5px; font-weight: 600; fill: #1e293b; }
    .badge-text { font-family: 'Prompt', 'Kanit', sans-serif; font-size: 22px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    .warn-title { font-family: 'Prompt', 'Kanit', sans-serif; font-size: 18px; font-weight: 800; fill: #b45309; }
    .warn-desc { font-family: 'Prompt', 'Kanit', sans-serif; font-size: 16.5px; font-weight: 600; fill: #78350f; }
  </style>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>
  
  <!-- Header Banner -->
  <rect x="25" y="16" width="1150" height="88" rx="14" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <circle cx="75" cy="60" r="30" fill="rgba(255,255,255,0.2)"/>
  <text x="75" y="60" font-size="34" text-anchor="middle" dominant-baseline="central">🗣️</text>
  <text x="125" y="50" class="title">เทคนิคการไออย่างมีประสิทธิภาพ (Effective Coughing)</text>
  <text x="125" y="82" class="subtitle">6 ขั้นตอนสำคัญเพื่อขับเสมหะออกจากปอด สำหรับผู้ที่มีแรงไอเพียงพอ</text>

  <!-- 6 STEPS (2 Rows x 3 Columns) -->

  <!-- STEP 1: จัดท่านั่งตัวตรง -->
  <g transform="translate(25, 120)">
    <rect width="365" height="295" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="365" height="54" rx="14" fill="#f0f9ff"/>
    <path d="M 0 38 L 0 54 L 365 54 L 365 38 Z" fill="#f0f9ff"/>
    <circle cx="36" cy="27" r="19" fill="url(#badgeGrad)"/>
    <text x="36" y="27" class="badge-text">1</text>
    <text x="68" y="34" class="card-title" fill="#0369a1">จัดท่านั่งตัวตรง</text>
    
    <!-- Visual Illustration Area -->
    <g transform="translate(182, 115)">
      <circle cx="0" cy="-30" r="20" fill="#fed7aa"/>
      <path d="M -14 -10 Q 0 -8 14 -10 L 10 32 L -10 32 Z" fill="#38bdf8"/>
      <path d="M -10 32 L 18 32 L 18 64 L 8 64" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
      <line x1="-22" y1="18" x2="-22" y2="68" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
      <line x1="-26" y1="40" x2="14" y2="40" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
      <line x1="6" y1="40" x2="6" y2="68" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
      <rect x="42" y="-28" width="68" height="26" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <text x="76" y="-12" font-family="Prompt" font-size="13" font-weight="800" fill="#0369a1" text-anchor="middle">เอน 60-90°</text>
    </g>

    <text x="20" y="215" class="card-desc">
      <tspan x="20" dy="0">❶ นั่งตัวตรงบนเก้าอี้ เท้าแตะพื้น</tspan>
      <tspan x="20" dy="26">❷ หรือเอนพนัก 45–90 องศา</tspan>
      <tspan x="20" dy="26">❸ ให้กระบังลมและปอดขยายเต็มที่</tspan>
    </text>
  </g>

  <!-- STEP 2: สูดหายใจเข้าลึกทางจมูก -->
  <g transform="translate(417, 120)">
    <rect width="365" height="295" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="365" height="54" rx="14" fill="#f0f9ff"/>
    <path d="M 0 38 L 0 54 L 365 54 L 365 38 Z" fill="#f0f9ff"/>
    <circle cx="36" cy="27" r="19" fill="url(#badgeGrad)"/>
    <text x="36" y="27" class="badge-text">2</text>
    <text x="68" y="34" class="card-title" fill="#0369a1">สูดหายใจเข้าลึก</text>

    <!-- Visual Illustration Area -->
    <g transform="translate(182, 115)">
      <circle cx="-15" cy="-28" r="20" fill="#fed7aa"/>
      <path d="M -28 -8 Q -5 -4 10 -8 L 14 32 L -28 32 Z" fill="#38bdf8"/>
      <path d="M 40 -35 Q 18 -30 6 -24" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <polygon points="4,-23 14,-21 11,-30" fill="#0284c7"/>
      <circle cx="20" cy="16" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="20" y="21" font-family="Prompt" font-size="16" font-weight="800" fill="#16a34a" text-anchor="middle">↑</text>
    </g>

    <text x="20" y="215" class="card-desc">
      <tspan x="20" dy="0">❶ สูดลมเข้าลึกทางจมูกช้า ๆ</tspan>
      <tspan x="20" dy="26">❷ สังเกตหน้าท้องป่องขยาย</tspan>
      <tspan x="20" dy="26">❸ ให้อากาศเข้าไปอยู่หลังก้อนเสมหะ</tspan>
    </text>
  </g>

  <!-- STEP 3: กลั้นหายใจ 2-3 วินาที -->
  <g transform="translate(810, 120)">
    <rect width="365" height="295" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="365" height="54" rx="14" fill="#f0f9ff"/>
    <path d="M 0 38 L 0 54 L 365 54 L 365 38 Z" fill="#f0f9ff"/>
    <circle cx="36" cy="27" r="19" fill="url(#badgeGrad)"/>
    <text x="36" y="27" class="badge-text">3</text>
    <text x="68" y="34" class="card-title" fill="#0369a1">กลั้นหายใจ 2–3 วิ</text>

    <!-- Visual Illustration Area -->
    <g transform="translate(182, 115)">
      <circle cx="-28" cy="0" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
      <path d="M -28 -15 L -28 0 L -18 6" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
      <rect x="15" y="-20" width="80" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="55" y="-1" font-family="Prompt" font-size="14" font-weight="800" fill="#b45309" text-anchor="middle">กลั้นลม</text>
      <text x="55" y="15" font-family="Prompt" font-size="13" font-weight="800" fill="#d97706" text-anchor="middle">2 - 3 วินาที</text>
    </g>

    <text x="20" y="215" class="card-desc">
      <tspan x="20" dy="0">❶ กลั้นลมหายใจไว้ 2 ถึง 3 วินาที</tspan>
      <tspan x="20" dy="26">❷ ให้อากาศกระจายทั่วถุงลมในปอด</tspan>
      <tspan x="20" dy="26">❸ สร้างแรงดันในช่องอกเตรียมไอ</tspan>
    </text>
  </g>

  <!-- STEP 4: เกร็งกล้ามเนื้อหน้าท้อง -->
  <g transform="translate(25, 435)">
    <rect width="365" height="295" rx="14" fill="url(#cardGrad)" stroke="#2dd4bf" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="365" height="54" rx="14" fill="#f0fdf4"/>
    <path d="M 0 38 L 0 54 L 365 54 L 365 38 Z" fill="#f0fdf4"/>
    <circle cx="36" cy="27" r="19" fill="url(#accentBadge)"/>
    <text x="36" y="27" class="badge-text">4</text>
    <text x="68" y="34" class="card-title" fill="#0f766e">เกร็งหน้าท้อง</text>

    <!-- Visual Illustration Area -->
    <g transform="translate(182, 115)">
      <circle cx="-15" cy="-28" r="20" fill="#fed7aa"/>
      <path d="M -24 -8 L 4 -8 L 0 32 L -24 32 Z" fill="#2dd4bf"/>
      <ellipse cx="8" cy="14" rx="18" ry="10" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/>
      <text x="8" y="18" font-family="Prompt" font-size="11" font-weight="800" fill="#be185d" text-anchor="middle">กดเกร็ง</text>
      <path d="M 32 4 Q 40 14 32 24" fill="none" stroke="#0d9488" stroke-width="3"/>
    </g>

    <text x="20" y="215" class="card-desc">
      <tspan x="20" dy="0">❶ เกร็งกล้ามเนื้อหน้าท้องแน่น</tspan>
      <tspan x="20" dy="26">❷ ใช้มือ/หมอนช่วยประคองหน้าท้อง</tspan>
      <tspan x="20" dy="26">❸ ช่วยเพิ่มพลังดันเสมหะพุ่งขึ้นมา</tspan>
    </text>
  </g>

  <!-- STEP 5: ไอแรง ๆ 2 ครั้งติดกัน (Double Cough) -->
  <g transform="translate(417, 435)">
    <rect width="365" height="295" rx="14" fill="url(#cardGrad)" stroke="#fb923c" stroke-width="2.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="365" height="54" rx="14" fill="#fff7ed"/>
    <path d="M 0 38 L 0 54 L 365 54 L 365 38 Z" fill="#fff7ed"/>
    <circle cx="36" cy="27" r="19" fill="url(#warnBadge)"/>
    <text x="36" y="27" class="badge-text">5</text>
    <text x="68" y="34" class="card-title" fill="#c2410c">ไอแรง 2 ครั้งติดกัน</text>

    <!-- Visual Illustration Area -->
    <g transform="translate(182, 115)">
      <rect x="-85" y="-24" width="75" height="50" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
      <text x="-47" y="-8" font-family="Prompt" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">ครั้งที่ 1</text>
      <text x="-47" y="14" font-family="Prompt" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="middle">เสมหะหลุด</text>
      
      <text x="3" y="6" font-family="Prompt" font-size="22" font-weight="800" fill="#f97316" text-anchor="middle">➔</text>

      <rect x="15" y="-24" width="75" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="52" y="-8" font-family="Prompt" font-size="13" font-weight="800" fill="#15803d" text-anchor="middle">ครั้งที่ 2</text>
      <text x="52" y="14" font-family="Prompt" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">ขับเสมหะออก</text>
    </g>

    <text x="20" y="215" class="card-desc">
      <tspan x="20" dy="0">❶ <strong fill="#b91c1c">ครั้งที่ 1:</strong> ไอแรงให้เสมหะหลุดผนัง</tspan>
      <tspan x="20" dy="26">❷ <strong fill="#15803d">ครั้งที่ 2:</strong> ไอซ้ำทันทีขับเสมหะขึ้นคอ</tspan>
      <tspan x="20" dy="26">❸ ขับเสมหะได้หมด ไม่เหนื่อยเค้นไอ</tspan>
    </text>
  </g>

  <!-- STEP 6: บ้วนเสมหะลงทิชชู -->
  <g transform="translate(810, 435)">
    <rect width="365" height="295" rx="14" fill="url(#cardGrad)" stroke="#2dd4bf" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="365" height="54" rx="14" fill="#f0fdf4"/>
    <path d="M 0 38 L 0 54 L 365 54 L 365 38 Z" fill="#f0fdf4"/>
    <circle cx="36" cy="27" r="19" fill="url(#accentBadge)"/>
    <text x="36" y="27" class="badge-text">6</text>
    <text x="68" y="34" class="card-title" fill="#0f766e">บ้วนเสมหะลงทิชชู</text>

    <!-- Visual Illustration Area -->
    <g transform="translate(182, 115)">
      <path d="M -30 -16 L 12 -20 L 28 12 L -14 16 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="0" cy="-2" r="7" fill="#67e8f9" opacity="0.8"/>
      <circle cx="38" cy="14" r="13" fill="#22c55e"/>
      <path d="M 33 14 L 37 18 L 44 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="20" y="215" class="card-desc">
      <tspan x="20" dy="0">❶ บ้วนเสมหะลงกระดาษทิชชูสะอาด</tspan>
      <tspan x="20" dy="26">❷ พับมิดชิดทิ้งถังขยะ และล้างมือ</tspan>
      <tspan x="20" dy="26">❸ นั่งพัก หายใจผ่อนคลายสบาย ๆ</tspan>
    </text>
  </g>

  <!-- Bottom Caution Box -->
  <g transform="translate(25, 750)">
    <rect width="1150" height="78" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="42" cy="39" r="20" fill="#fef3c7"/>
    <text x="42" y="41" font-size="22" text-anchor="middle" dominant-baseline="central">⚠️</text>
    <text x="75" y="32" class="warn-title">ข้อควรระวังสำคัญสำหรับผู้สูงอายุ:</text>
    <text x="75" y="58" class="warn-desc">ไม่ควรไอติดต่อกันหลาย ๆ ครั้งเพราะอาจทำให้เหนื่อยล้า เวียนศีรษะ หลอดลมหดเกร็ง หรือความดันสูงขึ้น หากเหนื่อยให้หยุดพักทันที</text>
  </g>
</svg>
